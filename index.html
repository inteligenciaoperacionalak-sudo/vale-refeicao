<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vale refeição · Tôa Tôa</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
</head>
<body>
<header id="topo"><h1>Vale refeição</h1><span class="emp">Cabana Tôa Tôa</span></header>
<main class="estreita" id="app"><p class="msg">Carregando…</p></main>
<script src="comum.js"></script>
<script>
// Cada supervisor tem dois QRs, que abrem direto o formulário certo (cadastro.html ou veiculo.html).
// Um link antigo com ?s= cai aqui e segue para o cadastro do vale.
var app = document.getElementById('app');
var COD = param('s').toUpperCase();
if (COD) {
  location.replace('cadastro.html?s=' + encodeURIComponent(COD));
} else {
  app.innerHTML = '<h2>Equipe da Cabana</h2><p class="msg" style="margin-top:6px">Parceiros entram pelo QR do supervisor: um para o cadastro do vale, outro para o adesivo no veículo.</p>'
    + '<div class="entrada-qr">'
    + '<a class="bt-entrada" href="caixa.html"><b>Caixa</b><span>Buscar o parceiro e liberar o almoço do dia.</span></a>'
    + '<a class="bt-entrada" href="painel.html"><b>Painel</b><span>Cadastros, adesivos, renovações, almoços e QRs dos supervisores.</span></a>'
    + '</div>';
}
</script>
</body>
</html>
