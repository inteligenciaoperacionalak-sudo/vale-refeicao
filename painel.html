<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrativo · Vale refeição</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<style>
.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th,.tabela td{text-align:left;padding:8px 6px;border-top:1px solid var(--linha);vertical-align:top}
.tabela th{font-size:12px;font-weight:700;color:var(--cinza);border-top:none}
.tabela td.n,.tabela th.n{text-align:right;font-variant-numeric:tabular-nums}
.tabela tr.clic{cursor:pointer}
.tabela tr.clic:hover td{background:var(--papel)}
.periodo{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.periodo > div{flex:1;min-width:130px}
.periodo label{margin-top:0}
.qrs{display:flex;gap:24px;flex-wrap:wrap;padding:6px 0 10px}
.qr-box{display:flex;gap:16px;align-items:flex-start;flex:1;min-width:min(300px,100%);flex-wrap:wrap;background:var(--papel);border:1px solid var(--linha);border-radius:10px;padding:12px}
.qr-box .qr{background:#fff;padding:8px;border:1px solid var(--linha);border-radius:8px}
.qr-box .qr img,.qr-box .qr canvas{display:block}
.qr-box .lk{flex:1;min-width:220px;font-size:13px;color:var(--cinza);overflow-wrap:anywhere}
.qr-box .lk code{display:block;background:var(--papel);padding:8px;border-radius:6px;margin:6px 0 10px;font-size:12px;color:var(--tinta)}
.sup-off{opacity:.6}
.zap{background:#25D366;color:#fff}
.dia-lista{padding:0 0 8px 12px}
.dia-lista .linha{padding:6px 0}
.exportar{white-space:nowrap}
.filtro.fim{justify-content:flex-end}
</style>
</head>
<body>
<header id="topo"><h1>Vale refeição</h1><span class="emp"></span></header>
<main class="larga" id="app"><p class="msg">Carregando…</p></main>
<script src="comum.js"></script>
<script src="qrcode.min.js"></script>
<script src="xlsx.js"></script>
<script>
// Painel administrativo (PIN administrativo). Supervisores e caixa não entram aqui:
// eles usam as telas de liberação (supervisor.html e caixa.html).
var app = document.getElementById('app');
var EST = null, D = null;
var VIEW = lerLS('vr_view') || 'uber';
var FILTRO = null;            // filtro ligado por um dos cards de resumo
var BUSCA = '', ABERTO = null, EDIT = null, QR_ABERTO = null;
var REL = { de: '', ate: '', dados: null, diaAberto: null, confEdit: null };
var EXP = null;               // o que "Exportar planilha" baixa, montado junto com a aba (respeita busca e filtro)

// Abas: as de categoria e, destacadas, as do sistema (Almoços e Supervisores)
var ABAS = [
  ['uber', 'Aplicativo e Taxistas', 'cat'], ['guia', 'Guias e Motoristas', 'cat'], ['prefeitura', 'Prefeitura', 'cat'],
  ['veiculos', 'Marketing de Veículo', 'cat'], ['renovacoes', 'Renovações', 'cat'],
  ['almocos', 'Almoços', 'sis'], ['supervisores', 'Supervisores', 'sis']
];
// Cards de resumo como filtro: em que abas cada um faz sentido e para qual aba leva quando não faz
var FILTROS = {
  ativo:     { abas: ['uber', 'guia', 'prefeitura'], padrao: 'uber' },
  vencendo:  { abas: ['uber', 'veiculos'], padrao: 'veiculos' },
  renovacao: { abas: ['uber', 'veiculos'], padrao: 'veiculos' },
  pendente:  { abas: ['uber'], padrao: 'uber' }
};
function rotuloFiltro(f){ return { ativo: 'ativos no vale', vencendo: 'vencendo em ' + (D ? D.aviso_dias : 15) + ' dias', renovacao: 'precisam renovar', pendente: 'pendentes' }[f] || f; }
function filtroAtivoAqui(){ return !!(FILTRO && FILTROS[FILTRO] && FILTROS[FILTRO].abas.indexOf(VIEW) >= 0); }

function topo(){
  var h = '<h1>Vale refeição</h1>';
  if (SESSAO.pin) h += '<span class="tag">Administrativo</span>';
  h += '<span class="emp">' + esc(EST ? EST.empresa : '') + '</span>';
  if (SESSAO.pin) h += '<a class="link" href="supervisor.html">Supervisor</a> <a class="link" href="caixa.html">Caixa</a> <button id="bt-sair">Sair</button>';
  document.getElementById('topo').innerHTML = h;
  var s = document.getElementById('bt-sair'); if (s) s.onclick = sair;
}
window.aoPerderSessao = function(){ D = null; topo(); telaPin(app, EST, ['admin'], 'PIN incorreto ou trocado. Digite de novo.', carregar); };

function boot(){
  apiPub('/estado').then(function(e){
    EST = e; topo();
    if (sessaoGuardada(['admin'])) carregar();
    else telaPin(app, EST, ['admin'], '', carregar);
  }).catch(function(){ app.innerHTML = '<p class="erro">Não consegui carregar. Verifique a conexão e recarregue a página.</p>'; });
}

function carregar(){
  return apiAuth('/painel').then(function(d){ D = d; render(); }).catch(function(e){ if (e.message !== '401') toast(e.message); });
}

function supNome(id){
  if (!D || !id) return '';
  for (var i = 0; i < D.supervisores.length; i++) if (D.supervisores[i].id === id) return D.supervisores[i].nome;
  return '';
}
function baseSite(){ return location.href.replace(/[#?].*$/, '').replace(/painel\.html$/, ''); }
function msgZap(v){
  return 'Olá, ' + v.nome.split(' ')[0] + '! Aqui é da Cabana Tôa Tôa. O adesivo do seu veículo ' + fmtPlaca(v.placa)
    + (v.dias < 0 ? ' venceu em ' : ' vence em ') + dBr(v.vencimento)
    + '. Para continuar com o almoço, é preciso renovar o adesivo e registrar de novo com o supervisor. Qualquer dúvida, fale com a gente.';
}
function telDisparo(t){ t = String(t || '').replace(/\D/g, ''); return t ? '55' + t : ''; }
// Conferência dos vales: diferença = vales recebidos − almoços no sistema (na hora da conferência)
function textoDif(dif){ return dif === 0 ? 'Bateu' : dif < 0 ? 'Falta ' + (-dif) : 'Sobra ' + dif; }
function classeDif(dif){ return dif === 0 ? 'ok' : dif < 0 ? 'falta' : 'sobra'; }
function difConf(c){ return c.vales - c.almocos_sistema; }

// ------------------------------------------------------------- render ---
function contagens(){
  var c = { ativos: 0, pendentes: 0, renovacao: 0, vencendo: 0, inativos: 0 };
  for (var i = 0; i < D.parceiros.length; i++) {
    var p = D.parceiros[i];
    if (p.status === 'ativo') c.ativos++; else if (p.status === 'pendente') c.pendentes++; else if (p.status === 'renovacao') c.renovacao++; else c.inativos++;
  }
  for (var j = 0; j < D.veiculos.length; j++) if (D.veiculos[j].situacao === 'vencendo') c.vencendo++;
  return c;
}
function card(k, n, rotulo, cls){
  var on = FILTRO === k && filtroAtivoAqui();
  return '<button type="button" class="num' + (cls ? ' ' + cls : '') + (on ? ' on' : '') + '" data-card="' + k + '" aria-pressed="' + on + '"><b>' + n + '</b><span>' + rotulo + '</span></button>';
}
// quebra do card "almoços hoje": quem liberou (as duas telas podem liberar qualquer categoria)
function quebraHoje(){
  var q = D.almocos_hoje_por || {}, partes = [];
  if (D.almocos_hoje) { partes.push((q.caixa || 0) + ' caixa'); partes.push((q.supervisor || 0) + ' sup.'); if (q.admin) partes.push(q.admin + ' adm'); }
  if (D.desfeitos_hoje) partes.push(D.desfeitos_hoje + ' desfeito' + (D.desfeitos_hoje > 1 ? 's' : ''));
  return partes.length ? ' · ' + partes.join(' · ') : '';
}
function cardConferencia(){
  var c = D.conferencia_hoje;
  if (!c) return card('conferencia', '—', 'conferência de hoje · não feita', D.almocos_hoje ? 'aviso' : '');
  var dif = difConf(c);
  return card('conferencia', textoDif(dif), 'conferência de hoje · ' + c.vales + ' vale' + (c.vales === 1 ? '' : 's') + ' / ' + c.almocos_sistema + ' almoço' + (c.almocos_sistema === 1 ? '' : 's'), dif === 0 ? 'ok' : dif < 0 ? 'alerta' : 'aviso');
}

function render(){
  topo();
  var c = contagens();
  var h = '<div class="numeros">'
    + card('ativo', c.ativos, 'ativos no vale', '')
    + card('vencendo', c.vencendo, 'vencendo em ' + D.aviso_dias + ' dias', c.vencendo ? 'aviso' : '')
    + card('renovacao', c.renovacao, 'precisam renovar', c.renovacao ? 'alerta' : '')
    + card('pendente', c.pendentes, 'pendentes', c.pendentes ? 'aviso' : '')
    + card('almocos_hoje', D.almocos_hoje, 'almoços hoje' + quebraHoje(), '')
    + cardConferencia()
    + '</div>';
  h += '<div class="abas"><div class="grupo">';
  for (var i = 0; i < ABAS.length; i++) {
    if (ABAS[i][2] === 'sis' && ABAS[i - 1][2] === 'cat') h += '</div><div class="grupo sis">';
    h += '<button class="aba ' + ABAS[i][2] + (VIEW === ABAS[i][0] ? ' on' : '') + '" data-view="' + ABAS[i][0] + '">' + ABAS[i][1] + ' <span class="n">' + contaAba(ABAS[i][0]) + '</span></button>';
  }
  h += '</div></div><div id="conteudo"></div>';
  app.innerHTML = h;
  var vs = app.querySelectorAll('[data-view]');
  for (var k = 0; k < vs.length; k++) vs[k].onclick = function(){ irPara(this.getAttribute('data-view')); };
  var cs = app.querySelectorAll('[data-card]');
  for (var m = 0; m < cs.length; m++) cs[m].onclick = function(){ clicarCard(this.getAttribute('data-card')); };
  renderConteudo();
}

function irPara(v){
  if (FILTRO && FILTROS[FILTRO] && FILTROS[FILTRO].abas.indexOf(v) < 0) FILTRO = null;   // o filtro não faz sentido na aba nova
  VIEW = v; gravarLS('vr_view', VIEW); ABERTO = null; EDIT = null; BUSCA = ''; render();
}

// Card clicado: filtra a aba atual, ou leva para a aba onde aquele número faz sentido
function clicarCard(f){
  if (f === 'almocos_hoje' || f === 'conferencia') {
    FILTRO = null; VIEW = 'almocos'; gravarLS('vr_view', VIEW); ABERTO = null; EDIT = null; BUSCA = '';
    REL.de = D.hoje; REL.ate = D.hoje; REL.dados = null; REL.diaAberto = null;
    render(); carregarRelatorio();
    return;
  }
  var def = FILTROS[f]; if (!def) return;
  if (def.abas.indexOf(VIEW) < 0) { VIEW = def.padrao; gravarLS('vr_view', VIEW); BUSCA = ''; FILTRO = f; }
  else FILTRO = FILTRO === f ? null : f;
  ABERTO = null; EDIT = null; render();
}

function passaFiltro(p){   // parceiro
  if (!filtroAtivoAqui()) return true;
  if (FILTRO === 'ativo') return p.status === 'ativo';
  if (FILTRO === 'pendente') return p.status === 'pendente';
  if (FILTRO === 'renovacao') return p.status === 'renovacao';
  if (FILTRO === 'vencendo') return p.status === 'ativo' && p.dias != null && p.dias <= D.aviso_dias;
  return true;
}
function passaFiltroV(v){  // veículo
  if (!filtroAtivoAqui()) return true;
  if (FILTRO === 'vencendo') return v.situacao === 'vencendo';
  if (FILTRO === 'renovacao') return v.situacao === 'vencido';
  return true;
}

function contaAba(v){
  if (!D) return '';
  var n = 0, i;
  if (v === 'uber') { for (i = 0; i < D.parceiros.length; i++) if (COM_ADESIVO[D.parceiros[i].categoria]) n++; return n; }
  if (v === 'guia') { for (i = 0; i < D.parceiros.length; i++) if (D.parceiros[i].categoria === 'guia' || D.parceiros[i].categoria === 'motorista') n++; return n; }
  if (v === 'prefeitura') { for (i = 0; i < D.parceiros.length; i++) if (D.parceiros[i].categoria === 'prefeitura') n++; return n; }
  if (v === 'veiculos') return D.veiculos.length;
  if (v === 'renovacoes') { for (i = 0; i < D.veiculos.length; i++) if (D.veiculos[i].situacao !== 'ativo') n++; return n; }
  if (v === 'supervisores') return D.supervisores.length;
  return '';
}

function renderConteudo(){
  var box = document.getElementById('conteudo');
  EXP = null;
  var h = filtroAtivoAqui() ? '<div class="filtrando">Mostrando só <b>' + esc(rotuloFiltro(FILTRO)) + '</b><button class="bt-link" id="f-limpar">Mostrar todos</button></div>' : '';
  if (VIEW === 'veiculos') h += htmlVeiculos();
  else if (VIEW === 'renovacoes') h += htmlRenovacoes();
  else if (VIEW === 'almocos') h += htmlAlmocos();
  else if (VIEW === 'supervisores') h += htmlSupervisores();
  else h += htmlParceiros();
  box.innerHTML = h;
  ligar();
}
function btExportar(){ return '<button class="bt-cinza exportar" id="exportar" title="Baixa uma planilha Excel com o que está na tela">Exportar planilha</button>'; }

// ---------------------------------------------------------- parceiros ---
function filtraBusca(lista, campos){
  var termos = norm(BUSCA).split(/\s+/).filter(Boolean);
  if (!termos.length) return lista;
  return lista.filter(function(p){
    var alvo = norm(campos.map(function(c){ return p[c] || ''; }).join(' '));
    for (var t = 0; t < termos.length; t++) if (alvo.indexOf(termos[t]) < 0) return false;
    return true;
  });
}

function colsParceiros(view){
  var c = [['Nome', 30], ['Categoria', 13], ['Telefone', 16], ['Telefone para disparo', 20], ['Empresa', 22]];
  if (view === 'prefeitura') c.push(['Setor', 24]);
  if (view === 'uber') c.push(['Placa', 10], ['Adesivo vence em', 16]);
  c.push(['Situação', 12], ['Cadastrado em', 14], ['Supervisor', 20]);
  return c;
}
function linhaExpParceiro(p, view){
  var l = [p.nome, CATEGORIAS[p.categoria] || p.categoria, fmtTel(p.telefone), telDisparo(p.telefone), p.empresa || ''];
  if (view === 'prefeitura') l.push(p.setor || '');
  if (view === 'uber') l.push(fmtPlaca(p.placa || ''), p.vencimento ? dBr(p.vencimento) : '');
  l.push(STATUS_NOME[p.status] || p.status, dataBRdeTs(p.criado_em), supNome(p.supervisor_id));
  return l;
}

function htmlParceiros(){
  var nomeAba = { uber: 'Aplicativo e Taxistas', guia: 'Guias e Motoristas', prefeitura: 'Prefeitura' }[VIEW];
  EXP = { arquivo: { uber: 'aplicativo-taxistas', guia: 'guias-motoristas', prefeitura: 'prefeitura' }[VIEW], aba: nomeAba, colunas: colsParceiros(VIEW), linhas: [] };
  var h = '<div class="caixa"><div class="filtro"><input type="search" id="p-busca" placeholder="Buscar por nome, telefone, placa ou empresa" value="' + esc(BUSCA) + '" aria-label="Buscar">' + btExportar() + '</div>';
  if (VIEW === 'uber') {
    h += '<p class="msg" style="margin-top:0">Aplicativo e taxista só ficam ativos com o adesivo registrado no Marketing de Veículo para o mesmo telefone e placa. O status aqui é calculado, não digitado. No dia a dia o almoço deles é liberado na tela do Caixa (o Supervisor também pode).</p>';
    h += blocoParceiros(['uber', 'taxista'], null);
  } else if (VIEW === 'guia') {
    h += '<p class="msg" style="margin-top:0">No dia a dia o almoço de guias e motoristas é liberado na tela do Supervisor, que confere o grupo e entrega o vale (o Caixa também pode).</p>';
    h += blocoParceiros(['guia'], 'Guias');
    h += blocoParceiros(['motorista'], 'Motoristas');
  } else {
    h += '<p class="msg" style="margin-top:0">No dia a dia o almoço da prefeitura é liberado na tela do Caixa (o Supervisor também pode).</p>';
    h += blocoParceiros(['prefeitura'], null);
  }
  return h + '</div>';
}

function blocoParceiros(cats, titulo){
  var lista = D.parceiros.filter(function(p){ return cats.indexOf(p.categoria) >= 0; });
  var vis = filtraBusca(lista.filter(passaFiltro), ['nome', 'telefone', 'placa', 'empresa', 'setor']);
  for (var e = 0; e < vis.length; e++) EXP.linhas.push(linhaExpParceiro(vis[e], VIEW));
  var h = titulo ? '<div class="bloco-tit">' + titulo + ' (' + lista.length + ')</div>' : '';
  if (!lista.length) return h + '<div class="vazio"><b>Ninguém cadastrado ainda</b><span class="msg">Os cadastros feitos pelo QR do supervisor aparecem aqui na hora.</span></div>';
  if (!vis.length) return h + '<div class="vazio"><span class="msg">' + (filtroAtivoAqui() && !BUSCA ? 'Ninguém em "' + esc(rotuloFiltro(FILTRO)) + '" aqui.' : 'Nada com essa busca.') + '</span></div>';
  for (var i = 0; i < vis.length; i++) {
    var p = vis[i];
    var sub = esc(fmtTel(p.telefone)) + (p.placa ? ' · ' + esc(fmtPlaca(p.placa)) : '') + (p.setor ? ' · ' + esc(p.setor) : '') + (p.empresa ? ' · ' + esc(p.empresa) : '')
      + (p.vencimento ? ' · adesivo até ' + dBr(p.vencimento) : '');
    h += '<div class="linha clic" data-abrir="' + p.id + '" role="button" tabindex="0" aria-expanded="' + (ABERTO === p.id) + '">'
      + '<div class="txt"><div class="tit">' + esc(p.nome) + '</div><div class="sub">' + sub + '</div></div>'
      + (cats.length > 1 ? pillCat(p.categoria) : '') + pillStatus(p.status) + '<span class="chev">' + (ABERTO === p.id ? '▴' : '▾') + '</span></div>';
    if (ABERTO === p.id) h += detalheParceiro(p);
  }
  return h;
}

function detalheParceiro(p){
  var h = '<div class="detalhe">';
  h += '<p class="msg">Cadastrado em ' + dataBRdeTs(p.criado_em) + (supNome(p.supervisor_id) ? ' pelo QR do supervisor ' + esc(supNome(p.supervisor_id)) : '') + (p.atualizado_em !== p.criado_em ? ' · alterado em ' + dataBRdeTs(p.atualizado_em) : '') + '</p>';
  if (COM_ADESIVO[p.categoria]) {
    if (p.status === 'pendente') {
      h += '<p class="erro">Sem adesivo registrado para este telefone + placa.' + (p.outra_placa ? ' Há um veículo com este telefone e placa <b>' + esc(fmtPlaca(p.outra_placa)) + '</b> — se for o mesmo carro, corrija a placa abaixo.' : ' Peça para registrar o adesivo pelo QR do supervisor.') + '</p>';
    } else if (p.vencimento) {
      h += '<p class="msg">Adesivo aplicado/renovado em ' + dBr(p.adesivo_em) + ' · vence em ' + dBr(p.vencimento) + ' (' + textoVenc(p.dias) + ').' + (p.status === 'renovacao' ? ' <b style="color:var(--verm)">Precisa renovar.</b>' : '') + '</p>';
    }
  }
  if (EDIT === p.id) {
    h += '<div class="grade">'
      + '<div class="cheio"><label for="e-nome">Nome</label><input type="text" id="e-nome" value="' + esc(p.nome) + '"></div>'
      + '<div><label for="e-tel">Telefone</label><input type="tel" id="e-tel" value="' + esc(fmtTel(p.telefone)) + '"></div>'
      + '<div><label for="e-cat">Categoria</label><select id="e-cat">' + ['guia', 'motorista', 'uber', 'taxista', 'prefeitura'].map(function(c){ return '<option value="' + c + '"' + (c === p.categoria ? ' selected' : '') + '>' + CATEGORIAS[c] + '</option>'; }).join('') + '</select></div>'
      + '<div><label for="e-emp">Empresa (opcional)</label><input type="text" id="e-emp" value="' + esc(p.empresa || '') + '"></div>'
      + '<div id="e-extra"></div></div>'
      + '<div class="acoes"><button class="bt-mar bt-mini" data-salvar="' + p.id + '">Salvar</button><button class="bt-cinza bt-mini" data-cancelar="1">Cancelar</button></div>';
  } else {
    h += '<div class="acoes">';
    if (!COM_ADESIVO[p.categoria]) h += p.status_manual === 'ativo'
      ? '<button class="bt-verm bt-mini" data-status="inativo" data-id="' + p.id + '">Inativar</button>'
      : '<button class="bt-verde bt-mini" data-status="ativo" data-id="' + p.id + '">Ativar</button>';
    h += '<button class="bt-cinza bt-mini" data-editar="' + p.id + '">Corrigir dados</button>'
      + '<a class="bt-mini bt-cinza" style="text-decoration:none" href="' + linkZap(p.telefone) + '" target="_blank" rel="noopener">WhatsApp</a>'
      + '<button class="bt-link bt-mini" data-excluir="' + p.id + '">Excluir cadastro</button></div>';
  }
  return h + '</div>';
}

function extraEdicao(cat, p){
  var ex = document.getElementById('e-extra'); if (!ex) return;
  if (cat === 'prefeitura') ex.innerHTML = '<label for="e-setor">Setor na prefeitura</label><input type="text" id="e-setor" value="' + esc(p.setor || '') + '">';
  else if (COM_ADESIVO[cat]) { ex.innerHTML = '<label for="e-placa">Placa</label><input type="text" id="e-placa" value="' + esc(fmtPlaca(p.placa || '')) + '">'; mascaraPlaca(document.getElementById('e-placa')); }
  else ex.innerHTML = '';
}

// ----------------------------------------------------------- veículos ---
function htmlVeiculos(){
  var vis = filtraBusca(D.veiculos.filter(passaFiltroV), ['nome', 'telefone', 'placa', 'modelo']);
  EXP = { arquivo: 'marketing-veiculo', aba: 'Marketing de Veículo',
    colunas: [['Nome', 30], ['Categoria', 22], ['Telefone', 16], ['Telefone para disparo', 20], ['Placa', 10], ['Modelo', 22], ['Adesivo em', 12], ['Vence em', 12], ['Situação', 11], ['Cadastro do vale', 26], ['Supervisor', 20]],
    linhas: vis.map(function(v){
      return [v.nome, v.categoria ? CAT_VEICULO[v.categoria] : '', fmtTel(v.telefone), telDisparo(v.telefone), fmtPlaca(v.placa), v.modelo, dBr(v.adesivo_em), dBr(v.vencimento), STATUS_NOME[v.situacao] || v.situacao,
        v.parceiro ? v.parceiro.nome + ' (' + (CATEGORIAS[v.parceiro.categoria] || v.parceiro.categoria) + ')' : (v.parceiro_outra_placa ? 'outra placa no vale: ' + fmtPlaca(v.parceiro_outra_placa.placa) : 'sem cadastro do vale'), supNome(v.supervisor_id)];
    }) };

function htmlAlmocos(){
  if (!REL.de) { var hj = D.hoje; REL.de = hj.slice(0, 8) + '01'; REL.ate = hj; }
  var h = '<div class="caixa"><div class="periodo">'
    + '<div><label for="r-de">De</label><input type="date" id="r-de" value="' + esc(REL.de) + '"></div>'
    + '<div><label for="r-ate">Até</label><input type="date" id="r-ate" value="' + esc(REL.ate) + '"></div>'
    + '<button class="bt-mar" id="r-ok">Ver almoços</button>'
    + (REL.dados && REL.dados.almocos.length ? btExportar() : '') + '</div>'
    + '<p class="msg">Conta o que foi liberado nas telas do Supervisor e do Caixa, com quem liberou; os desfeitos ficam marcados e fora do total. A conferência compara os vales físicos recebidos com o sistema.</p>';
  if (REL.dados) {
    var todos = REL.dados.almocos, a = todos.filter(function(x){ return !x.desfeito_em; });
    var confs = {}; (REL.dados.conferencias || []).forEach(function(c){ confs[c.data] = c; });
    var porCat = {}, porDia = {}, dias = [];
    for (var i = 0; i < todos.length; i++) {
      var x = todos[i];
      if (!porDia[x.data]) { porDia[x.data] = { total: 0, cats: {}, lista: [], desfeitos: [] }; dias.push(x.data); }
      if (x.desfeito_em) { porDia[x.data].desfeitos.push(x); continue; }
      porCat[x.categoria] = (porCat[x.categoria] || 0) + 1;
      porDia[x.data].total++; porDia[x.data].cats[x.categoria] = (porDia[x.data].cats[x.categoria] || 0) + 1; porDia[x.data].lista.push(x);
    }
    // dias que só têm conferência (sem almoço) também aparecem
    Object.keys(confs).forEach(function(dt){ if (!porDia[dt]) { porDia[dt] = { total: 0, cats: {}, lista: [], desfeitos: [] }; dias.push(dt); } });
    dias.sort().reverse();
    var cs = ['guia', 'motorista', 'uber', 'taxista', 'prefeitura'];
    var situacao = function(x){ return x.desfeito_em ? 'Desfeito ' + horaBR(x.desfeito_em) + ' pelo ' + (PERFIL_NOME[x.desfeito_por] || x.desfeito_por || '') : 'Ativo'; };
    EXP = { arquivo: 'almocos-' + REL.de + '-a-' + REL.ate, aba: 'Almoços',
      colunas: [['Data', 12], ['Hora', 8], ['Nome', 30], ['Categoria', 13], ['Liberado por', 14], ['Situação', 26], ['Vales conferidos (dia)', 20], ['Diferença (dia)', 16]],
      linhas: todos.slice().reverse().map(function(x){ var c = confs[x.data]; return [dBr(x.data), horaBR(x.hora), x.nome, CATEGORIAS[x.categoria] || x.categoria, PERFIL_NOME[x.liberado_por] || x.liberado_por || '', situacao(x), c ? c.vales : '', c ? textoDif(difConf(c)) : 'não conferida']; }) };
    if (!dias.length) h += '<div class="vazio"><span class="msg">Nenhum almoço liberado no período.</span></div>';
    else {
      var nConf = 0, nDif = 0, nDesf = todos.length - a.length;
      dias.forEach(function(dt){ if (confs[dt]) { nConf++; if (difConf(confs[dt]) !== 0) nDif++; } });
      h += '<div class="numeros" style="margin-top:14px"><div class="num"><b>' + a.length + '</b><span>almoços no período' + (nDesf ? ' · ' + nDesf + ' desfeito' + (nDesf > 1 ? 's' : '') : '') + '</span></div>';
      for (var c = 0; c < cs.length; c++) if (porCat[cs[c]]) h += '<div class="num"><b>' + porCat[cs[c]] + '</b><span>' + CATEGORIAS[cs[c]] + '</span></div>';
      h += '<div class="num' + (nConf < dias.length ? ' aviso' : '') + '"><b>' + nConf + '/' + dias.length + '</b><span>dias conferidos</span></div>';
      h += '<div class="num' + (nDif ? ' alerta' : (nConf ? ' ok' : '')) + '"><b>' + nDif + '</b><span>dias com diferença</span></div>';
      h += '</div><table class="tabela"><thead><tr><th>Dia</th><th class="n">Total</th><th>Por categoria</th><th class="n">Vales</th><th>Conferência</th></tr></thead><tbody>';
      for (var d = 0; d < dias.length; d++) {
        var dt = dias[d], dia = porDia[dt], cf = confs[dt], partes = [];
        for (var k = 0; k < cs.length; k++) if (dia.cats[cs[k]]) partes.push(dia.cats[cs[k]] + ' ' + CATEGORIAS[cs[k]]);
        if (dia.desfeitos.length) partes.push('<span style="color:var(--cinza)">' + dia.desfeitos.length + ' desfeito' + (dia.desfeitos.length > 1 ? 's' : '') + '</span>');
        h += '<tr class="clic" data-dia="' + dt + '"><td>' + dBr(dt) + ' ' + (REL.diaAberto === dt ? '▴' : '▾') + '</td><td class="n"><b>' + dia.total + '</b></td><td>' + partes.join(' · ') + '</td>'
          + '<td class="n">' + (cf ? cf.vales : '<span style="color:var(--cinza)">—</span>') + '</td>'
          + '<td>' + (cf ? '<span class="pill ' + (difConf(cf) === 0 ? 'ativo' : difConf(cf) < 0 ? 'renovacao' : 'pendente') + '">' + esc(textoDif(difConf(cf))) + '</span>' : '<span class="pill neutro">não conferida</span>') + '</td></tr>';
        if (REL.diaAberto === dt) {
          h += '<tr><td colspan="5"><div class="dia-lista">' + htmlConfDia(dt, dia, cf);
          for (var m = 0; m < dia.lista.length; m++) h += '<div class="linha"><div class="txt"><div class="tit" style="font-size:14px">' + esc(dia.lista[m].nome) + '</div><div class="sub">' + esc(CATEGORIAS[dia.lista[m].categoria] || dia.lista[m].categoria) + ' · ' + horaBR(dia.lista[m].hora) + (dia.lista[m].liberado_por ? ' · ' + esc(PERFIL_NOME[dia.lista[m].liberado_por] || dia.lista[m].liberado_por) : '') + '</div></div></div>';
          for (var q = 0; q < dia.desfeitos.length; q++) { var ds = dia.desfeitos[q]; h += '<div class="linha desfeito"><div class="txt"><div class="tit" style="font-size:14px">' + esc(ds.nome) + '</div><div class="sub">' + esc(CATEGORIAS[ds.categoria] || ds.categoria) + ' · liberado ' + horaBR(ds.hora) + ' · desfeito ' + horaBR(ds.desfeito_em) + ' pelo ' + esc(PERFIL_NOME[ds.desfeito_por] || ds.desfeito_por || '') + '</div></div></div>'; }
          h += '</div></td></tr>';
        }
      }
      h += '</tbody></table>';
    }
  }
  return h + '</div>';
}

// Conferência de um dia dentro do relatório: resultado + formulário para lançar ou corrigir
function htmlConfDia(dt, dia, cf){
  var h = '<div class="conf' + (cf ? ' ' + classeDif(difConf(cf)) : '') + '" style="margin:6px 0 10px">';
  if (cf) {
    var depois = dia.lista.filter(function(x){ return Date.parse(x.hora) > Date.parse(cf.hora); }).length;
    h += '<div class="conf-tit">Conferência · ' + horaBR(cf.hora) + ' · ' + esc(PERFIL_NOME[cf.perfil] || cf.perfil) + '</div>'
      + '<div class="conf-num">Sistema ' + cf.almocos_sistema + ' · Vales recebidos ' + cf.vales + ' · <b>' + textoDif(difConf(cf)) + '</b></div>'
      + (cf.observacao ? '<div class="msg" style="margin:4px 0 0">' + esc(cf.observacao) + '</div>' : '')
      + (depois ? '<div class="msg" style="margin:4px 0 0">' + depois + ' almoço' + (depois > 1 ? 's' : '') + ' liberado' + (depois > 1 ? 's' : '') + ' depois da conferência (hoje o dia tem ' + dia.total + ').</div>' : '');
  } else {
    h += '<div class="conf-tit">Conferência</div><div class="msg" style="margin:0">Não feita. O caixa confere na tela dele ao fim do almoço; o administrativo pode lançar aqui.</div>';

  } else {
    h += '<div class="acoes" style="margin-top:10px"><button class="bt-cinza bt-mini" data-confeditar="' + dt + '">' + (cf ? 'Corrigir conferência' : 'Lançar conferência') + '</button></div>';
  }
  return h + '</div>';

function buscarRelatorio(){

}

  if (b) b.oninput = function(){ BUSCA = this.value; ABERTO = null; EDIT = null; var pos = this.selectionStart; renderConteudo(); var nb = document.getElementById('p-busca'); nb.focus(); nb.setSelectionRange(pos, pos); };
  var ex0 = document.getElementById('exportar'); if (ex0) ex0.onclick = exportar;
  var fl = document.getElementById('f-limpar'); if (fl) fl.onclick = function(){ FILTRO = null; ABERTO = null; EDIT = null; render(); };

  var alternar = function(attr){ return function(){ var id = this.getAttribute(attr); ABERTO = ABERTO === id ? null : id; EDIT = null; renderConteudo(); }; };
  var ls = box.querySelectorAll('[data-abrir]');
  for (var i = 0; i < ls.length; i++) { ls[i].onclick = alternar('data-abrir'); ls[i].onkeydown = teclaAbre('data-abrir'); }
  var lv = box.querySelectorAll('[data-abrirv]');
  for (var j = 0; j < lv.length; j++) { lv[j].onclick = alternar('data-abrirv'); lv[j].onkeydown = teclaAbre('data-abrirv'); }

  // parceiros
  var st = box.querySelectorAll('[data-status]');
  for (var k = 0; k < st.length; k++) st[k].onclick = function(){
    var id = this.getAttribute('data-id'), s = this.getAttribute('data-status');
    apiAuth('/parceiros/' + id + '/status', { method: 'POST', body: { status: s } }).then(function(){ toast(s === 'ativo' ? 'Cadastro ativado.' : 'Cadastro inativado.'); carregar(); }).catch(function(e){ if (e.message !== '401') toast(e.message); });
  };
  var ed = box.querySelector('[data-editar]');
  if (ed) ed.onclick = function(){ EDIT = this.getAttribute('data-editar'); renderConteudo(); };
  var edv = box.querySelector('[data-editarv]');
  if (edv) edv.onclick = function(){ EDIT = this.getAttribute('data-editarv'); renderConteudo(); };
  var cc = box.querySelector('[data-cancelar]');
  if (cc) cc.onclick = function(){ EDIT = null; renderConteudo(); };
  var sv = box.querySelector('[data-salvar]');
  if (sv) {
    var p = acha(D.parceiros, EDIT);
    var sel = document.getElementById('e-cat');
    extraEdicao(sel.value, p);
    sel.onchange = function(){ extraEdicao(this.value, p); };
    mascaraTel(document.getElementById('e-tel'));
    sv.onclick = function(){
      var cat = sel.value;
      var dados = { nome: document.getElementById('e-nome').value, telefone: document.getElementById('e-tel').value, categoria: cat, empresa: document.getElementById('e-emp').value,
        setor: cat === 'prefeitura' ? document.getElementById('e-setor').value : '', placa: COM_ADESIVO[cat] ? document.getElementById('e-placa').value : '' };
      sv.disabled = true;
      apiAuth('/parceiros/' + p.id, { method: 'POST', body: dados }).then(function(){ EDIT = null; toast('Cadastro corrigido.'); carregar(); }).catch(function(e){ sv.disabled = false; if (e.message !== '401') toast(e.message); });
    };
  }
  var svv = box.querySelector('[data-salvarv]');
  if (svv) {
    var v = acha(D.veiculos, EDIT);
    mascaraTel(document.getElementById('e-tel')); mascaraPlaca(document.getElementById('e-placa'));
    svv.onclick = function(){
      var cat = document.getElementById('e-vcat').value;
      if (!cat) { toast('Escolha se é taxista ou motorista de aplicativo.'); return; }
      var dados = { nome: document.getElementById('e-nome').value, telefone: document.getElementById('e-tel').value, placa: document.getElementById('e-placa').value, modelo: document.getElementById('e-modelo').value, categoria: cat };
      svv.disabled = true;
      apiAuth('/veiculos/' + v.id, { method: 'POST', body: dados }).then(function(){ EDIT = null; toast('Veículo corrigido.'); carregar(); }).catch(function(e){ svv.disabled = false; if (e.message !== '401') toast(e.message); });
    };
  }
  var ex = box.querySelector('[data-excluir]');
  if (ex) ex.onclick = function(){
    var p = acha(D.parceiros, this.getAttribute('data-excluir'));
    if (!confirm('Excluir o cadastro de ' + p.nome + '? Ele sai do vale e só volta se fizer o cadastro de novo. Os almoços já liberados ficam no relatório.')) return;
    apiAuth('/parceiros/' + p.id, { method: 'DELETE' }).then(function(){ ABERTO = null; toast('Cadastro excluído.'); carregar(); }).catch(function(e){ if (e.message !== '401') toast(e.message); });
  };
  var exv = box.querySelector('[data-excluirv]');
  if (exv) exv.onclick = function(){
    var v = acha(D.veiculos, this.getAttribute('data-excluirv'));
    if (!confirm('Excluir o veículo ' + fmtPlaca(v.placa) + ' de ' + v.nome + '? As fotos e o histórico do adesivo são apagados, e o vale dele fica pendente.')) return;
    apiAuth('/veiculos/' + v.id, { method: 'DELETE' }).then(function(){ ABERTO = null; toast('Veículo excluído.'); carregar(); }).catch(function(e){ if (e.message !== '401') toast(e.message); });
  };

  // almoços
  var rok = document.getElementById('r-ok'); if (rok) rok.onclick = buscarRelatorio;
  var ds = box.querySelectorAll('[data-dia]');
  for (var m = 0; m < ds.length; m++) ds[m].onclick = function(){ var d = this.getAttribute('data-dia'); REL.diaAberto = REL.diaAberto === d ? null : d; REL.confEdit = null; renderConteudo(); };
  var ce = box.querySelector('[data-confeditar]');
  if (ce) ce.onclick = function(){ REL.confEdit = this.getAttribute('data-confeditar'); renderConteudo(); var kv = document.getElementById('k-vales'); if (kv) kv.focus(); };
  var ccf = box.querySelector('[data-confcancelar]');
  if (ccf) ccf.onclick = function(){ REL.confEdit = null; renderConteudo(); };
  var cs_ = box.querySelector('[data-confsalvar]');
  if (cs_) cs_.onclick = function(){
    var dt = this.getAttribute('data-confsalvar'), v = parseInt(document.getElementById('k-vales').value, 10);
    if (isNaN(v) || v < 0) { toast('Digite a quantidade de vales recebidos.'); return; }
    cs_.disabled = true;
    apiAuth('/conferencias', { method: 'POST', body: { data: dt, vales: v, observacao: document.getElementById('k-obs').value } }).then(function(r){
      REL.confEdit = null; toast('Conferência gravada: ' + textoDif(difConf(r.conferencia)) + '.');
      carregarRelatorio(); if (dt === D.hoje) carregar();
    }).catch(function(e){ cs_.disabled = false; if (e.message !== '401') toast(e.message); });
  };

  // supervisores
  var sadd = document.getElementById('s-add');
  if (sadd) sadd.onclick = function(){
    var nome = document.getElementById('s-nome').value.trim();
    if (nome.length < 2) { toast('Escreva o nome do supervisor.'); return; }
    sadd.disabled = true;
    apiAuth('/supervisores', { method: 'POST', body: { nome: nome } }).then(function(s){ QR_ABERTO = s.id; toast('Supervisor adicionado.'); carregar(); }).catch(function(e){ sadd.disabled = false; if (e.message !== '401') toast(e.message); });
  };
  var sn = document.getElementById('s-nome'); if (sn) sn.onkeydown = function(ev){ if (ev.key === 'Enter') sadd.click(); };
  var qs = box.querySelectorAll('[data-qr]');
  for (var q = 0; q < qs.length; q++) qs[q].onclick = function(){ var id = this.getAttribute('data-qr'); QR_ABERTO = QR_ABERTO === id ? null : id; renderConteudo(); };
  var sa = box.querySelectorAll('[data-supativo]');
  for (var r = 0; r < sa.length; r++) sa[r].onclick = function(){
    var id = this.getAttribute('data-supativo'), ativo = this.getAttribute('data-valor') === '1';
    if (!ativo && !confirm('Desativar este supervisor? Os QRs dele param de funcionar; os cadastros que ele já autorizou continuam.')) return;
    apiAuth('/supervisores/' + id, { method: 'POST', body: { ativo: ativo } }).then(function(){ toast(ativo ? 'Supervisor reativado.' : 'Supervisor desativado.'); carregar(); }).catch(function(e){ if (e.message !== '401') toast(e.message); });
  };
  if (QR_ABERTO) {
    var s = acha(D.supervisores, QR_ABERTO);
    for (var qi = 0; s && qi < QRS.length; qi++) {
      var alvo = document.getElementById('qr-' + QRS[qi].k + '-' + QR_ABERTO);
      if (!alvo) continue;
      if (window.QRCode) new QRCode(alvo, { text: QRS[qi].link(s.codigo), width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
      else alvo.innerHTML = '<p class="msg">Não consegui gerar o QR. Use o link ao lado.</p>';
    }
  }
  var cps = box.querySelectorAll('[data-copiar]');
  for (var c = 0; c < cps.length; c++) cps[c].onclick = function(){
    var t = this.getAttribute('data-copiar');
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('Link copiado.'); }, function(){ prompt('Copie o link:', t); });
    else prompt('Copie o link:', t);
  };
  var bxs = box.querySelectorAll('[data-baixar]');
  for (var bx = 0; bx < bxs.length; bx++) bxs[bx].onclick = function(){
    var alvo = document.getElementById('qr-' + this.getAttribute('data-baixar')), nome = this.getAttribute('data-nome');
    var cv = alvo ? alvo.querySelector('canvas') : null, img = alvo ? alvo.querySelector('img') : null;
    var src = cv ? cv.toDataURL('image/png') : (img ? img.src : '');
    if (!src) { toast('QR ainda não gerado.'); return; }
    var el = document.createElement('a'); el.href = src; el.download = 'qr-' + norm(nome).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png'; document.body.appendChild(el); el.click(); el.remove();
  };
}
function teclaAbre(attr){ return function(ev){ if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); this.click(); } }; }
function acha(lista, id){ for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i]; return null; }

document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && D && !EDIT) carregar(); });
boot();
</script>
</body>
</html>
